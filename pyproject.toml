[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SafeFaceController"
version = "0.1.0"
description = "Non-blocking Raspberry Pi 5 face servo controller"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "SafeFaceController" }
]
dependencies = [
  "adafruit-circuitpython-servokit>=1.3.0",
  "PyQt5>=5.15"
]

[tool.setuptools]
packages = ["safe_face_controller"]
